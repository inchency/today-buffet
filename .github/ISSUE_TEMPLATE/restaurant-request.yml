name: 식당 등록 요청
description: 공개 메뉴 공지 링크가 필수입니다. 지점과 날짜 확인 후 반영합니다.
title: "[식당 등록] "
labels: [community-submission, restaurant-request]
body:
  - type: input
    id: restaurant_name
    attributes:
      label: 식당 이름
      description: 지점명까지 적어 주세요.
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: 주소·지역
    validations:
      required: true
  - type: input
    id: menu_url
    attributes:
      label: 공개 메뉴 공지 링크
      description: 인스타·네이버 소식·주간 식단표 등 실제 메뉴를 확인할 수 있는 https 링크가 필수입니다.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 추가 설명
      description: 메뉴 날짜 등 확인할 내용을 적어 주세요. 개인정보·인증 정보는 적지 마세요.
  - type: checkboxes
    id: consent
    attributes:
      label: 공개 확인
      options:
        - label: 제보 내용이 공개되고 검증 후 반영되는 것을 확인했습니다.
          required: true
